services:
  pastebin:
    build: .
    image: encrypted-pastebin:latest
    container_name: pastebin
    restart: unless-stopped
    ports:
      # Хостовый порт берётся из .env (PORT), контейнерный всегда 3000
      - "${PORT:-3000}:3000"
    environment:
      # Значения берутся из файла .env рядом с docker-compose.yml
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - BASE_URL=${BASE_URL:-}
      # Базовый путь при работе по под-пути (например /pastebin). Пусто — корень.
      - BASE_PATH=${BASE_PATH:-}
      # true — запретить регистрацию новых пользователей
      - REGISTRATION_DISABLED=${REGISTRATION_DISABLED:-false}
    volumes:
      # Постоянное хранение БД, ключа шифрования и файлов записей
      - pastebin-data:/app/data

volumes:
  pastebin-data: